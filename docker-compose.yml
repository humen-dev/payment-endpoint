services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    ports:
      - "5434:5432"
    volumes:
      - ./docker/create-test-database.sql:/docker-entrypoint-initdb.d/create-test-database.sql:ro
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 2s
      timeout: 5s
      retries: 15

  app:
    build:
      context: .
      target: app
    environment:
      DATABASE_URL: postgresql+psycopg://shop:shop@db:5432/shop
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Runs the test suite in Docker: `docker compose run --rm tests`.
  # The profile keeps it out of a plain `docker compose up`.
  tests:
    build:
      context: .
      target: dev
    profiles: ["test"]
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://shop:shop@db:5432/shop_test
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
